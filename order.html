<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SPYRO | Place Order</title>

    <link rel="stylesheet" href="style.css">

</head>

<body class="order-page">


<!-- =========================
     HEADER
========================= -->

<header class="order-header">

    <a href="index.html" class="order-logo">
        SPYRO
    </a>

    <a href="index.html" class="back-home">
        ← Back to Shop
    </a>

</header>


<!-- =========================
     ORDER CONTAINER
========================= -->

<main class="order-container">

    <div class="order-heading">

        <p class="order-small-title">
            SPYRO MASALAS
        </p>

        <h1>
            Place Your Order
        </h1>

        <p>
            Enter your details and review your order.
        </p>

    </div>


    <div class="order-layout">


        <!-- =========================
             CUSTOMER FORM
        ========================= -->

        <section class="order-form-card">

            <h2>
                Customer Details
            </h2>


            <form id="order-form">

                <div class="form-group">

                    <label for="customer-name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="customer-name"
                        placeholder="Enter your full name"
                        required>

                </div>


                <div class="form-group">

                    <label for="customer-phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="customer-phone"
                        placeholder="10-digit phone number"
                        maxlength="10"
                        required>

                </div>


                <div class="form-group">

                    <label for="customer-address">
                        Address
                    </label>

                    <textarea
                        id="customer-address"
                        placeholder="House name, street, area"
                        rows="4"
                        required></textarea>

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label for="customer-city">
                            City
                        </label>

                        <input
                            type="text"
                            id="customer-city"
                            placeholder="City"
                            required>

                    </div>


                    <div class="form-group">

                        <label for="customer-pincode">
                            Pincode
                        </label>

                        <input
                            type="text"
                            id="customer-pincode"
                            placeholder="6-digit pincode"
                            maxlength="6"
                            required>

                    </div>

                </div>


                <button
                    type="submit"
                    class="place-order-button">

                    Place Order

                </button>

            </form>

        </section>



        <!-- =========================
             ORDER SUMMARY
        ========================= -->

        <section class="order-summary-card">

            <div class="summary-top">

                <p>
                    YOUR CART
                </p>

                <h2>
                    Order Summary
                </h2>

            </div>


            <!-- CART PRODUCTS -->

            <div id="order-items"
                 class="order-items">

            </div>


            <div class="summary-divider"></div>


            <div class="summary-total">

                <span>
                    Total
                </span>

                <strong id="order-total">
                    ₹0
                </strong>

            </div>

        </section>

    </div>

</main>


<script>

/* =========================================================
   SPYRO — ORDER PAGE
========================================================= */


/* =========================
   LOAD CART
========================= */

let cart =
    JSON.parse(
        localStorage.getItem("spyroCart")
    ) || [];


/* =========================
   ELEMENTS
========================= */

const orderItems =
    document.getElementById("order-items");

const orderTotal =
    document.getElementById("order-total");

const orderForm =
    document.getElementById("order-form");


/* =========================
   DISPLAY ORDER SUMMARY
========================= */

function displayOrder() {

    orderItems.innerHTML = "";

    let total = 0;


    /* EMPTY CART */

    if (cart.length === 0) {

        orderItems.innerHTML = `
            <p class="no-order">
                Your cart is empty.
            </p>
        `;

        orderTotal.textContent = "₹0";

        return;
    }


    /* DISPLAY PRODUCTS */

    cart.forEach(item => {

        const quantity =
            Number(item.quantity) || 1;

        const price =
            Number(item.price) || 0;

        const itemTotal =
            price * quantity;

        total += itemTotal;


        const orderItem =
            document.createElement("div");

        orderItem.className =
            "order-item";


        orderItem.innerHTML = `

            <div>

                <h3>
                    ${item.name}
                </h3>

                <p>
                    ₹${price} × ${quantity}
                </p>

            </div>

            <strong>
                ₹${itemTotal}
            </strong>

        `;


        orderItems.appendChild(
            orderItem
        );

    });


    /* TOTAL */

    orderTotal.textContent =
        `₹${total}`;

}


/* =========================
   PLACE ORDER
========================= */

orderForm.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        /* CHECK CART */

        if (cart.length === 0) {

            alert(
                "Your cart is empty. Please add a product first."
            );

            return;
        }


        /* CUSTOMER DETAILS */

        const name =
            document.getElementById(
                "customer-name"
            ).value.trim();


        const phone =
            document.getElementById(
                "customer-phone"
            ).value.trim();


        const address =
            document.getElementById(
                "customer-address"
            ).value.trim();


        const city =
            document.getElementById(
                "customer-city"
            ).value.trim();


        const pincode =
            document.getElementById(
                "customer-pincode"
            ).value.trim();


        /* PHONE CHECK */

        if (!/^[0-9]{10}$/.test(phone)) {

            alert(
                "Please enter a valid 10-digit phone number."
            );

            return;
        }


        /* PINCODE CHECK */

        if (!/^[0-9]{6}$/.test(pincode)) {

            alert(
                "Please enter a valid 6-digit pincode."
            );

            return;
        }


        /* =========================
           CREATE WHATSAPP MESSAGE
        ========================= */

        let message =
            "SPYRO ORDER\n\n";


        message +=
            "CUSTOMER DETAILS\n";

        message +=
            "Name: " + name + "\n";

        message +=
            "Phone: " + phone + "\n";

        message +=
            "Address: " + address + "\n";

        message +=
            "City: " + city + "\n";

        message +=
            "Pincode: " + pincode + "\n\n";


        message +=
            "ORDER ITEMS\n";


        let total = 0;


        cart.forEach(item => {

            const quantity =
                Number(item.quantity) || 1;

            const price =
                Number(item.price) || 0;

            const itemTotal =
                price * quantity;

            total += itemTotal;


            message +=
                item.name +
                " × " +
                quantity +
                " = ₹" +
                itemTotal +
                "\n";

        });


        message +=
            "\nTOTAL: ₹" + total;


        /* =========================
           WHATSAPP NUMBER
        ========================= */

        const whatsappNumber =
            "91XXXXXXXXXX";


        const whatsappURL =
            "https://wa.me/" +
            whatsappNumber +
            "?text=" +
            encodeURIComponent(message);


        /* OPEN WHATSAPP */

        window.location.href =
            whatsappURL;

    }
);


/* =========================
   LOAD ORDER
========================= */

displayOrder();

</script>

</body>

</html>
